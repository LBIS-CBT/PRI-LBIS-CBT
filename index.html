<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#781d37">
  <meta name="description" content="Lead British International School examination portal.">
  <title>LBIS CBT | Login</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261125-login-compact1">
  <script src="assets/js/login.js" defer></script>
</head>
<body>
  <div id="unsupported-device" class="device-message" role="alert" hidden>
    <div class="device-message__panel">
      <h1>Device not supported</h1>
      <p>LBIS CBT is designed for laptops, desktop computers and tablets. Please access the examination system using a supported device.</p>
    </div>
  </div>

  <main class="page-shell">
    <section class="login-panel" aria-labelledby="page-title">
      <h1 id="page-title">LBIS CBT</h1>
      <p class="school-name">Lead British International School</p>
      <form id="account-form">
        <label for="account-type">Select account type</label>
        <select id="account-type" name="accountType" required>
          <option value="" selected disabled>Choose Student or Admin</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit">Submit</button>
        <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <footer>
      <nav aria-label="Legal information">
        <a href="/privacy-policy/">Privacy Policy</a>
        <span aria-hidden="true"> · </span>
        <a href="/terms-of-service/">Terms of Service</a>
      </nav>
      <p><strong style="font:inherit;font-weight:700;color:#ffffff;">Designed by TUPS Technologies: visit <a href="https://info.tupstechnologies.com" target="_blank" rel="noopener noreferrer" style="font:inherit;font-weight:700;color:#ffffff;text-decoration:underline;">info.tupstechnologies.com</a></strong></p>
    </footer>
  </main>
</body>
</html>
