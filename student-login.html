<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="theme-color" content="#781d37">
  <title>LBIS CBT | Student Login</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261125-login-compact1">
  <style>
    /* Student login is laptop/desktop/tablet only. Never let legacy phone-warning
       styles hide this page or display an obsolete warning overlay. */
    html, body { min-height: 100% !important; }
    body { display: block !important; }
    .page-shell { display: flex !important; visibility: visible !important; }
    .device-message, #unsupported-device { display: none !important; visibility: hidden !important; }
  </style>
  <script src="assets/js/student-login.js?v=20261126-session2?v=20261124-student-login-force1" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="login-panel" aria-labelledby="page-title">
      <h1 id="page-title">Student Login</h1>
      <p class="school-name">Lead British International School</p>
      <form id="student-login-form" novalidate>
        <label for="admission-number">Admission Number</label>
        <input id="admission-number" name="admissionNumber" type="text" autocomplete="username" maxlength="60" required>
        <label for="student-class">Class</label>
        <input id="student-class" name="className" type="text" placeholder="Automatically retrieved after verification" readonly aria-describedby="class-help">
        <p id="class-help" class="field-help">Your class is retrieved securely after your Admission Number and Examination Password are verified.</p>
        <label for="exam-password">Examination Password</label>
        <input id="exam-password" name="examPassword" type="password" autocomplete="current-password" maxlength="128" required>
        <button type="submit">Enter Exam Room</button>
        <p id="student-login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <a class="back-link" href="index.html">Back</a>
    </section>
    <footer><strong style="font:inherit;font-weight:700;color:#ffffff;">Designed by TUPS Technologies: visit <a href="https://info.tupstechnologies.com" target="_blank" rel="noopener noreferrer" style="font:inherit;font-weight:700;color:#ffffff;text-decoration:underline;"><em>info.tupstechnologies.com</em></a> for enquiry.</strong></footer>
  </main>
</body>
</html>
