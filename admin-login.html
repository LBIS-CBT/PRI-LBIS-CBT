<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#781d37">
  <title>LBIS CBT | Admin Login</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261125-login-compact1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/admin-login.js" defer></script>
</head>
<body>
  <div id="unsupported-device" class="device-message" role="alert" hidden>
    <div class="device-message__panel">
      <h1>Device not supported</h1>
      <p>LBIS CBT is designed for laptops, desktop computers and tablets. Please access the system using a supported device.</p>
    </div>
  </div>

  <main class="page-shell">
    <section class="login-panel" aria-labelledby="page-title">
      <h1 id="page-title">Admin Login</h1>
      <p class="school-name">Lead British International School</p>

      <form id="admin-identity-form" novalidate>
        <label for="admin-code">Admin Code</label>
        <input id="admin-code" name="adminCode" type="text" autocomplete="username" required>
        <label for="admin-role">Select Role</label>
        <select id="admin-role" name="role" required>
          <option value="" selected disabled>Choose Teacher or Admin</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit">Continue</button>
        <p id="admin-identity-message" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <form id="admin-password-form" hidden novalidate>
        <p id="admin-role-summary" class="role-summary"></p>
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
        <button id="change-admin-identity" class="button-secondary" type="button">Back</button>
        <p id="admin-password-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <a class="back-link" href="index.html">Back to account selection</a>
    </section>
    <footer><strong style="font:inherit;font-weight:700;color:#ffffff;">Designed by TUPS Technologies: visit <a href="https://info.tupstechnologies.com" target="_blank" rel="noopener noreferrer" style="font:inherit;font-weight:700;color:#ffffff;text-decoration:underline;"><em>info.tupstechnologies.com</em></a> for enquiry.</strong></footer>
  </main>
</body>
</html>
